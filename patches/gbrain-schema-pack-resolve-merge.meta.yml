anchor: "4dafc249eeed095bbadd5adba2d2853b3d74b5ee6a6875ef10543b8fe5a9bcac"
invariant: >
  src/core/schema-pack/registry.ts carries the VF-FIX-SP-MERGE sentinel and
  resolvePack composes BOTH axes (child-wins) into resolved.manifest via
  resolveComposed()/composeManifest(): the EXTENDS chain (root->leaf) feeds all
  mergeable arrays, and leaf.borrow_from (recursively resolved per borrowed pack,
  filtered to entry.types/link_types) feeds page_types + link_types ONLY, with the
  precedence ladder leaf-own > explicit-borrow > extends-inherited. A SINGLE shared
  visiting-set guards true borrow cycles, and TWO independent budgets bound the graph
  (#1838): per-path BORROW recursion depth (<=EXTENDS_DEPTH_HARD_CAP, +1 per borrow hop
  only — NOT extends-chain length, so borrow breadth never false-trips it) AND a shared
  TOTAL-resolutions cap (MERGE_TOTAL_RESOLUTIONS_CAP=64). filterBorrowed FAILS LOUD
  (BorrowedTypeNotFoundError) if a borrow names a type/link_type absent from the fully
  resolved source, and composeManifest FAILS LOUD (DanglingReferenceError) on any merged
  calibration_domains/mapping_rules/frontmatter_links reference to a missing type/link
  (the referential checks strict Zod does NOT do). alias_graph/alias_closure_hash
  recompute over the MERGED manifest; identity/manifest_sha8 stay leaf-anchored. PROOF
  (run locally
  @4ee530f): `gbrain schema active` for a pack `extends: gbrain-base-v2` reports the
  inherited 15 page_types + additions (vf-v1 -> 17/16, not the child's own 2);
  gbrain-recommended resolves 0/0 -> 30/12; gbrain-everything (extends gbrain-investor
  -> base, borrow_from creator(atom) + engineer(learning)) resolves WITH atom
  (primitive=concept, creator's def winning the collision by rule) + learning present;
  and the HARD no-op invariant holds — gbrain-base-v2 standalone (extends:null AND
  borrow_from:[]) short-circuits to the child BY REFERENCE (resolved.manifest === the
  raw parsed manifest object), so it is byte-identical to upstream under ANY
  serialization. Reproducible anchor (verified locally @4ee530f): the canonical-JSON
  sha256 (sorted keys, the same canonicalization computeManifestSha8 uses) of the
  resolved gbrain-base-v2 manifest =
  b9bebaa4044b406380c2cf4d1260f6ec28d4f20ed1f214a3555672f1c9a72668 (gbrain
  manifest_sha8 = its 8-hex prefix b9bebaa4; identity gbrain-base-v2@1.0.0+b9bebaa4).
  resolvePack(base-v2).manifest must be the SAME object reference as the input.
still_needed_probe: patches/gbrain-schema-pack-resolve-merge.probe.sh
target_files:
  - "gbrain src/core/schema-pack/registry.ts (FULL-FILE REPLACEMENT keyed to 4ee530f content sha256 4dafc249...)"
why: >
  Upstream #1749 (open, confirmed broken @ 4ee530f): resolvePack walks the extends
  chain ONLY for the depth cap + cache snapshot, then builds ResolvedPack from the
  BARE CHILD manifest — buildAliasGraph(manifest)/computeAliasClosureHash(manifest)
  and the `manifest:` literal all reference the child (upstream's own comment: "Full
  extends-merging (child-wins) is the v0.41+ T20 follow-up"). So a pack with
  `extends: gbrain-base-v2` (the VF goal) collapses to its own types instead of
  inheriting the 15 page_types + 14 link_types. The patch is a FULL-FILE REPLACEMENT
  (the merge is a large multi-line rewrite of the chain walk + post-walk block +
  ResolvedPack consumers — too fragile for an anchor-splice across non-contiguous
  regions) guarded by a PRE-CLOBBER content-checksum gate (installed registry.ts
  sha256 must equal the pinned 4ee530f hash 4dafc249...; mismatch FAILS THE BUILD so
  we re-derive the drop-in rather than clobber a file we did not key to). The drop-in
  adds composeManifest(): keyed-override+union for page_types/link_types/
  frontmatter_links/enrichable_types/filing_rules; set-union+floor (fact|take|bet|
  hunch) for takes_kinds; set-union for phases; keyed for calibration_domains;
  concat-dedupe + *unknown* retype catch-all forced LAST for mapping_rules; absence-
  preserving for the .optional() arrays. It writes the merged taxonomy into
  resolved.manifest (the field every consumer reads), recomputes alias graph/closure
  over the merged manifest, keeps identity/manifest_sha8 leaf-anchored (already true
  upstream — no work), and short-circuits standalone packs to a byte-identical no-op.
  SCOPE NOW COVERS THE FULL EXPANDING-SCHEMA FEATURE — EXTENDS *AND* borrow_from.
  resolveComposed() recursively resolves each borrowed pack to its FULL manifest (its
  own extends+borrow composed) then filters to the borrow entry's types/link_types,
  contributing to page_types + link_types ONLY (exactly the two arrays the borrow_from
  schema carries — NOT phases/calibration_domains/filing_rules/takes_kinds, which the
  lens YAMLs re-declare explicitly by design). PRECEDENCE (specificity): leaf-own >
  explicit-borrow > extends-inherited(root->leaf) — a borrow is a DELIBERATE pull of a
  named def so it beats generic inheritance; this decides the red-team's
  creator.atom-vs-base.atom collision by RULE (everything's atom = creator's,
  primitive=concept). The #1838 borrow stack-overflow is killed by a SINGLE shared
  visiting-set (true borrow cycle = re-entry on the active borrow path -> throws
  ExtendsChainTooDeepError) + TWO independent budgets: per-path borrow-recursion depth
  (+1 PER BORROW HOP, bounded by EXTENDS_DEPTH_HARD_CAP=8) and a shared total-resolutions
  cap (MERGE_TOTAL_RESOLUTIONS_CAP=64). Borrow breadth is NOT counted as extends depth,
  so a pack borrowing many shallow siblings is not falsely capped; the extends chain
  keeps its own leaf-inclusive length cap. Sibling borrows sharing an ancestor (the
  everything->base-via-extends + creator/engineer-borrow-which-extend-base diamond) are
  NOT mis-flagged — visiting holds only the active borrow-path pack names, never
  extends-parents, and each frame removes exactly the name it added. HARDENING (red-team
  §3/§4): filterBorrowed FAILS LOUD (BorrowedTypeNotFoundError) when a borrow names a
  type/link_type absent from the fully resolved source pack (a silent drop would leave a
  dangling calibration/mapping ref that Zod misses), and composeManifest FAILS LOUD
  (DanglingReferenceError) on any merged calibration_domains[].page_types /
  mapping_rules retype.to_type|page_to_link.link_type / frontmatter_links[].page_type|
  link_type pointing at a type/link not in the merged taxonomy — porting the registry's
  documented-but-uncodified referential post-checks onto the MERGED manifest. Borrows
  resolve sequentially in declared order (later-declared wins a key collision) with plain
  set()/Map merges -> cold-run deterministic. The leaf-only
  ref-eq fast path AND the by-ref short-circuit are both gated to the standalone
  predicate (extends:null AND borrow_from:[]) so leaf==merged stays sound and a
  parent/borrowed-pack edit can never serve a stale merge in-process — the cache
  `chain` now records borrowed deps too, so invalidatePackCache cascades on a
  borrowed-pack edit. NOT filed upstream (operator decision — VF-only fork patch).
  Proven locally end-to-end on a pristine 4ee530f clone + via the baked patch on a
  Docker-equivalent tree: recommended 0/0->30/12, vf-v1(extends base-v2)->17/16,
  gbrain-everything gains atom+learning via borrow, base-v2 no-op hash unchanged,
  schema-pack tests pass.
