# anchor: the load-bearing SPLICE anchor — the self-documenting upstream comment
# that marks where resolvePack still builds from the bare child. --check verifies
# this string is in the .sh body; at build time the patch's anchor-presence
# PREFLIGHT fails (exit 1 -> build FAILS, old container keeps serving) if this
# comment is gone (upstream landed the T20 follow-up -> RETIRE) or any of the 3
# target tokens moved (-> RE-POINT). This REPLACES the old whole-file sha256 gate
# (the patch is now a surgical anchor-splice, not a full-file replacement, so a
# whole-file checksum would churn on every unrelated upstream edit to registry.ts).
anchor: "// Full extends-merging (child-wins) is the v0.41+ T20 follow-up."
invariant: >
  src/core/schema-pack/registry.ts carries the VF-FIX-SP-MERGE sentinel and
  resolvePack composes BOTH axes (child-wins) into resolved.manifest. The patch is
  an ANCHOR-SPLICE (C+B refactor — NOT a full-file replacement): (1) it widens the
  two manifest-v1 imports; (2) it inserts, just before the alias-graph build,
  `const merged = (manifest.extends || (manifest.borrow_from && manifest.borrow_from.length))
  ? await mergeExtendsChain(manifest, loadByName, opts) : manifest;` and swaps the 3
  consumers child->merged (buildAliasGraph(manifest)->(merged),
  computeAliasClosureHash(manifest)->(merged), the ResolvedPack literal field
  `manifest,`->`manifest: merged,`); (3) it APPENDS, as a pure end-of-file block
  carrying VF-FIX-SP-MERGE, mergeExtendsChain + resolveComposed + composeManifest +
  helpers + the BorrowedTypeNotFoundError/DanglingReferenceError classes (this code
  is LIFTED VERBATIM from the prior proven full-file drop-in, only RELOCATED). The
  merge: the EXTENDS chain (root->leaf) feeds all mergeable arrays, and
  leaf.borrow_from (recursively resolved per borrowed pack, filtered to
  entry.types/link_types) feeds page_types + link_types ONLY, with the precedence
  ladder leaf-own > explicit-borrow > extends-inherited. A SINGLE shared visiting-set
  guards true borrow cycles, and TWO independent budgets bound the graph (#1838):
  per-path BORROW recursion depth (<=EXTENDS_DEPTH_HARD_CAP, +1 per borrow hop only —
  NOT extends-chain length) AND a shared TOTAL-resolutions cap
  (MERGE_TOTAL_RESOLUTIONS_CAP=64). filterBorrowed FAILS LOUD (BorrowedTypeNotFoundError)
  if a borrow names a type/link_type absent from the fully resolved source;
  composeManifest FAILS LOUD (DanglingReferenceError) on any merged
  calibration_domains/mapping_rules/frontmatter_links reference to a missing type/link.
  alias_graph/alias_closure_hash recompute over the MERGED manifest; identity/
  manifest_sha8 stay leaf-anchored. The inline guard short-circuits a standalone pack
  (extends:null AND borrow_from:[]) to `: manifest` -> merged === the raw parsed
  manifest object BY REFERENCE -> byte-identical no-op. GUARD: the whole-file sha256
  gate is REPLACED by (a) an anchor-presence PREFLIGHT (exit 1 if the T20 comment or
  any of the 3 target tokens / 2 import lines is absent) AND (b) a perl MATCH-COUNT
  assertion (each of the 3 substitutions must apply EXACTLY once; 0-or-multi -> exit 1)
  so the splice can NEVER silently no-op; plus marker idempotency + post-write
  `gbrain --version` smoke + `tsc --noEmit`. PROOF (run locally @4ee530f, via the
  CONFIG-ACTIVATION path loadActivePack({dbConfig:<name>}) — NOT `schema use`):
  a custom pack `extends: gbrain-base-v2` (single-line description, +2 page_types +2
  link_types) resolves to 17/16 (inherited 15 + own 2); gbrain-everything (extends
  gbrain-investor -> base, borrow_from creator(atom) + engineer(learning)) resolves to
  28/12 WITH atom (primitive=concept, creator's def winning the collision by rule) +
  learning present; and the HARD no-op invariant holds — gbrain-base-v2 standalone
  resolves 15/14 and resolvePack(base-v2).manifest === the input object (by reference).
  Reproducible anchor (verified locally @4ee530f): the canonical-JSON sha256 of the
  resolved gbrain-base-v2 manifest =
  b9bebaa4044b406380c2cf4d1260f6ec28d4f20ed1f214a3555672f1c9a72668 (gbrain
  manifest_sha8 = b9bebaa4; identity gbrain-base-v2@1.0.0+b9bebaa4).
still_needed_probe: patches/gbrain-schema-pack-resolve-merge.probe.sh
target_files:
  - "gbrain src/core/schema-pack/registry.ts (ANCHOR-SPLICE: import widen + inline `const merged` + 3 consumer swaps, anchored on the v0.41+ T20 follow-up comment, match-count-guarded; plus an additive VF-FIX-SP-MERGE end-of-file block)"
why: >
  C+B REFACTOR of the previously-deployed 3-patch schema fix down to ONE patch.
  Upstream #1749 (open, confirmed broken @ 4ee530f): resolvePack walks the extends
  chain ONLY for the depth cap + cache snapshot, then builds ResolvedPack from the
  BARE CHILD manifest — buildAliasGraph(manifest)/computeAliasClosureHash(manifest)
  and the `manifest:` literal all reference the child (upstream's own comment: "Full
  extends-merging (child-wins) is the v0.41+ T20 follow-up"). So a pack with
  `extends: gbrain-base-v2` (the VF goal) collapses to its own types instead of
  inheriting 15 page_types + 14 link_types, and the bundled lens meta-pack
  gbrain-everything resolves to 0/0 (never composes borrow_from, #1838). THE AUDIT
  FINDING: the inheritance engine lives ENTIRELY in resolvePack, and the
  CONFIG-ACTIVATION path (DB/tier `cfg.schema_pack` -> defaultPackLocator ->
  resolvePack) exercises that merge IDENTICALLY to `schema use`. defaultPackLocator
  already lists all 7 bundled packs AND locates installed ~/.gbrain/schema-packs/<name>
  packs. So a custom `extends: gbrain-base-v2` pack activated via
  `gbrain config set schema_pack <name>` resolves FULLY without the former SSOT patch,
  and the lens packs compose via config activation. THE TWO COMPANION PATCHES WERE
  DROPPED (proven unnecessary for the config-activation path), with documented,
  accepted DX losses: (1) the loader.ts js-yaml block-scalar patch (#1750) — custom
  packs must now use a SINGLE-LINE `description:` (no `|` block); (2) the bundled-SSOT
  patch (#1574/#1726) — a custom/lens pack is activated via `gbrain config set
  schema_pack <name>`, NOT `schema use <name>` (which prints "Unknown pack" for
  non-{base,recommended} names — a CLI that lies about its own state; documented in
  UPGRADING_GBRAIN.md), `schema list` shows 2 not 7, and gbrain-recommended reverts to
  0-types (its `description: |` truncates again — irrelevant to us). The retained merge
  patch is converted from FULL-FILE REPLACEMENT to a surgical ANCHOR-SPLICE of
  registry.ts: the merge machinery (composeManifest/resolveComposed/mergeExtendsChain +
  helpers + the two fail-loud error classes) is LIFTED VERBATIM from the proven
  full-file drop-in into an additive end-of-file block, and a 4-token inline splice
  (insert `const merged`, swap the 2 alias consumers + the ResolvedPack literal) wires
  it in. SCOPE COVERS THE FULL EXPANDING-SCHEMA FEATURE — EXTENDS *AND* borrow_from.
  PRECEDENCE (specificity): leaf-own > explicit-borrow > extends-inherited(root->leaf)
  — a borrow is a DELIBERATE pull of a named def so it beats generic inheritance; this
  decides the red-team's creator.atom-vs-base.atom collision by RULE (everything's atom =
  creator's, primitive=concept). The #1838 borrow stack-overflow is killed by a SINGLE
  shared visiting-set + TWO independent budgets (per-path borrow depth <=8, total
  resolutions <=64). HARDENING (red-team §3/§4): filterBorrowed FAILS LOUD
  (BorrowedTypeNotFoundError) on a borrow naming a type absent from the resolved source;
  composeManifest FAILS LOUD (DanglingReferenceError) on a dangling
  calibration/mapping/frontmatter reference in the merged taxonomy. GUARD STRATEGY: the
  old pre-clobber whole-file sha256 gate is REPLACED by an anchor-presence preflight +
  a perl match-count assertion (the splice can NEVER silently no-op — when upstream
  ships T20 the comment changes -> preflight fails LOUD -> we delete the patch). NOT
  filed upstream (operator decision — VF-only fork patch). Proven locally end-to-end on
  a pristine 4ee530f clone via the config-activation path: vf-v1(extends base-v2)->17/16,
  gbrain-everything->28/12 with atom+learning, base-v2 standalone 15/14 by-ref no-op
  (sha8 b9bebaa4 unchanged), the perturbed-anchor splice EXITS 1 (fail-loud), tsc
  --noEmit clean, and 327 schema-pack/resolver tests pass.
reapply: docker-build
deprecate_when: >
  garrytan/gbrain lands the T20 extends-merge follow-up AND composes borrow_from
  (#1749 + #1838) so resolvePack builds the resolved pack from the MERGED extends+
  borrow chain (not the bare child), and GBRAIN_REF advances past it. On the upgrade,
  the anchor-presence PREFLIGHT fails the build (the "v0.41+ T20 follow-up" comment is
  gone or the 3 target tokens moved) — re-read the upstream registry.ts and either
  RE-POINT the splice (UPGRADING_GBRAIN.md -> "Re-pointing the schema-pack merge
  anchor-splice") or RETIRE if upstream fixed it. The still_needed_probe checks whether
  the bare-child anchor/comment is gone and a merge is present.
