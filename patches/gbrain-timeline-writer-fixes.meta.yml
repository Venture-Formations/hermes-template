     hermes-template.
  2. Drop the `RUN bash /app/patches/gbrain-timeline-writer-fixes.sh` Dockerfile
     block (deploy/venture-formations-fork branch).
  3. Run `bun run tools/gen-modifications.ts` in hermes-template, regenerate
     MODIFICATIONS.md + lock; commit both repos.
  4. Trigger Railway rebuild.
  5. After deploy:
     (TL-1) enrichEntity resumes stamping new Date() on all timeline entries.
     The idx_timeline_dedup idempotency gate is defeated — re-runs on different
     days accumulate duplicate rows. Run 03-timeline-cleanup.sh --apply to
     re-dedup the newly minted rows (but note it will re-accumulate until TL-1
     is restored).
     (TL-2) check-backlinks fix resumes writing dated 'Referenced in' rows to
     ## Timeline. Run 03-timeline-cleanup.sh --apply to clean the noise (same
     caveat as TL-1 — re-accumulates until TL-2 is restored).
     (TL-4) ## Timeline sections stop being sorted on write. Re-order is
     cosmetic; no data is lost.

redo: >
  Docker build RUN block re-applies all three edits automatically after each
  `bun install -g github:garrytan/gbrain#${GBRAIN_REF}`. Idempotent: each
  sub-fix has its own sentinel check (FIX-TL-1-WRITER / FIX-TL-2-WRITER /
  FIX-TL-4-WRITER); a second run is a no-op on any block already applied.
  Precondition: gbrain-timeline-bullet-hyphen-split.sh (FIX-TL-3) must run
  BEFORE this script in the Dockerfile (the parser must be hyphen-safe first).

upgrade_eval: >
  1. TL-1 anchor: `grep -nF "date: new Date().toISOString().split" src/core/enrichment-service.ts`
     at the new GBRAIN_REF. If absent → the build already failed. If the
     addTimelineEntry call was refactored (different date field name, different
     block shape), re-point TL1_ANCHOR in the .sh.
     Also confirm the gbrain-allow-direct-insert comment is still on the same
     line (it is part of the OLD_BLOCK the perl splice matches — if gbrain
     changed this comment, the match will fail at build time; re-point).
  2. TL-2a anchor: `grep -nF "Referenced in \[" src/commands/backlinks.ts`
     at the new GBRAIN_REF. Confirm buildBacklinkEntry still has the
     '- **${date}** | Referenced in ...' return form (if gbrain already changed
     it to an undated form, TL-2a deprecation condition is met).
  3. TL-2b/TL-4 anchor: `grep -nF "// Insert into Timeline section" src/commands/backlinks.ts`
     at the new GBRAIN_REF. If absent → the build already failed; re-point.
     Confirm the 15-line fixBacklinkGaps insert block (the OLD block in the .sh)
     is still verbatim — any upstream change to the Timeline insert logic means
     the block shape changed; re-point TL24_OLD accordingly.
  4. UPSTREAM FIX CHECK: for each of TL-1/TL-2/TL-4, check the gbrain release
     changelog. If gbrain fixed a sub-item upstream:
     (a) Remove the corresponding sub-block from the .sh (update the script
         so it no longer applies that edit), OR
     (b) Remove the whole patch if all three are fixed and the upstream versions
         satisfy the invariants.
     Confirm by running verify-upgrade.sh after the partial/full deprecation.
  5. Lane C gate: `03-timeline-cleanup.sh` is gated on TL-1 being live (the
     dedup key needs stable dates). After any upgrade, re-check whether the TL-1
     sentinel is present in the installed enrichment-service.ts before running
     the cleanup. If TL-1 was deprecated (upstream fixed), confirm the upstream
     fix uses the same or compatible precedence chain (published_at → captured_at
     → today) before running the cleanup.
  6. Invariant re-confirm (verify-upgrade.sh): all three FIX-TL-*-WRITER
     sentinels are present; the old 'date: new Date().toISOString()...' line and
     the old '// Insert into Timeline section' block are absent.
  7. Bump last_validated_ref.

rollback_speed: >
  Fail-safe: if any of the three anchor checks fails, the .sh exits non-zero →
  Docker build fails → old container keeps serving. No outage. Re-point the
  failed anchor and rebuild.
  If a behavioral regression is discovered after a successful build, revert the
  Dockerfile commit removing this patch's RUN line, push, and Railway rebuilds
  (~3-5 min). Data written by the patched version (## Mentions sections, sorted
  ## Timeline) is forward-compatible: ## Mentions is additive; Timeline sort is
  idempotent. No compensating data migration is needed on rollback.
