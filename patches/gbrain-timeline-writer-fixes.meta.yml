# UPSTREAM CANDIDATE: YES (all three are unambiguous bugs). File upstream PRs
# for each; carry the patch until they land. Ordering: TL-3 ships first
# (parser must be hyphen-safe), then TL-1 (stable dates), then TL-2 + TL-4
# (writer routing + sort). Lane C runbook 03-timeline-cleanup.sh is gated on
