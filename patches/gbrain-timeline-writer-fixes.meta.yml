# Source-of-truth metadata for a gbrain-core modification.
# Read by hermes-workspace/tools/gen-modifications.ts -> MODIFICATIONS.md.
# source_sha below is the real sha256 of the .sh body. If you edit the .sh, re-run
# `bun tools/gen-modifications.ts` (the pre-commit --check gate fails on mismatch).

id: gbrain-timeline-writer-fixes
title: "Timeline writer: stable publish-date + Mentions segregation + sort-DESC (FIX-TL-1 + TL-2 + TL-4)"
category: gbrain-core
risk: red
repo: hermes-template
source: patches/gbrain-timeline-writer-fixes.sh
source_sha: "cdcc4cf29502189ef45a77014b03defc3092b1d215e73585dfedd741587dd3ed"

# anchor: the primary anchor the patch body self-audits. There are three edit
# blocks across two files; each has a secondary anchor checked in the .sh body
# before the edit runs. The PRIMARY anchor is the TL-1 site (enrichment-service).
# gen-modifications.ts --check confirms this string is present in the .sh body.
anchor: "date: new Date().toISOString().split('T')[0] ?? '',"

# anchor_file_line: location of the primary anchor in the pinned gbrain tree.
anchor_file_line: "src/core/enrichment-service.ts:116 (gbrain@099d9a8)"

# Secondary anchors (each checked inside the .sh before the corresponding edit):
#   TL-2a: "return `- **${date}** | Referenced in [${sourceTitle}](${sourcePath})`;"
#           -> src/commands/backlinks.ts:67 (gbrain@099d9a8)
#   TL-2b/TL-4: "// Insert into Timeline section"
#           -> src/commands/backlinks.ts:164 (gbrain@099d9a8)
# All three verified verbatim at the live pin.

# invariant: the runtime assertions verify-upgrade.sh checks on-container.
invariant: >
  (TL-1) src/core/enrichment-service.ts addTimelineEntry block contains the
  FIX-TL-1-WRITER sentinel and uses published_at/captured_at frontmatter
  precedence instead of new Date(); the old 'date: new Date().toISOString()...'
  line is absent.
  (TL-2) src/commands/backlinks.ts buildBacklinkEntry contains the FIX-TL-2-WRITER
  sentinel and returns an undated '- Referenced in [...]' line (not a dated
  '- **${date}** | Referenced in [...]' line).
  (TL-4) src/commands/backlinks.ts fixBacklinkGaps contains the FIX-TL-4-WRITER
  sentinel; the old '// Insert into Timeline section' block is absent; the
  ## Mentions routing + ## Timeline sort blocks are present.

still_needed_probe: patches/gbrain-timeline-writer-fixes.probe.sh

target_files:
  - "gbrain src/core/enrichment-service.ts:116 (addTimelineEntry date field; FIX-TL-1)"
  - "gbrain src/commands/backlinks.ts:67 (buildBacklinkEntry return; FIX-TL-2a)"
  - "gbrain src/commands/backlinks.ts:164 (fixBacklinkGaps insert block; FIX-TL-2b + TL-4)"

why: >
  Three related bugs turn the on-disk `## Timeline` section into crawl-dated
  noise rather than a meaningful chronology. (1) FIX-TL-1: enrichEntity stamps
  every DB timeline entry with `new Date()` (wall-clock NOW, enrichment-service.ts:116)
  rather than the source page's actual publish date. `now()` defeats the
  idempotency of the idx_timeline_dedup UNIQUE index on (page_id, date, summary,
  source): two runs on different calendar days produce two distinct date values
  and two rows. The fix resolves the date from the source page's frontmatter
  using the precedence chain our collectors stamp (published_at → captured_at
  → today as last resort). (2) FIX-TL-2: check-backlinks fix appends a dated
  '- **DATE** | Referenced in [X](path)' line to every target's ## Timeline for
  every bare back-edge (backlinks.ts:66-67 + 164-178) — every entity mention
  becomes a dated timeline event, drowning real events in noise (~90% of rows
  in the live brain are this class). Fix: route bare back-edges to a ## Mentions
  section (new, undated list); ## Timeline is reserved for genuine dated events
  from engine.addTimelineEntry. (3) FIX-TL-4: fixBacklinkGaps formerly inserted
  into ## Timeline with no sort; entries accumulated in insert order rather than
  reverse-chronological as the enrich template promises. With TL-2 blocking new
  writes to ## Timeline, TL-4 adds a cleanup sort pass: whenever fixBacklinkGaps
  writes a page it also re-sorts any existing ## Timeline section by date DESC.
  Precondition: FIX-TL-3 (gbrain-timeline-bullet-hyphen-split) must be applied
  first — the parser must be hyphen-safe before the writer changes what it emits.

reapply: docker-build    # idempotent perl splices with per-sentinel no-op guards; re-runs after the gbrain install on every GBRAIN_REF bump

deprecate_when: >
  garrytan/gbrain fixes all three issues upstream:
  (TL-1) enrichEntity derives timeline date from published_at/captured_at
         frontmatter, not from new Date();
  (TL-2) check-backlinks fix routes bare back-edges to ## Mentions, not ## Timeline;
  (TL-4) fixBacklinkGaps sorts ## Timeline DESC after any write.
  When all three are present in the installed tree, remove this patch, rebuild,
  and confirm via verify-upgrade.sh that the sentinels' invariants hold naturally.
  Partial deprecation is acceptable: deprecate individual sub-fixes (TL-1/TL-2/TL-4)
  independently as they land upstream; keep the patch until all three are covered.

