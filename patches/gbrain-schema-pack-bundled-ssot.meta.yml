invariant: >
  A new src/core/schema-pack/bundled.ts SSOT (sentinel VF-FIX-SP-SSOT) exports
  BUNDLED_PACK_NAMES (7) + BUNDLED_PACK_NAME_SET; src/commands/schema.ts (sentinel
  VF-FIX-SP-SSOT) consumes it in runList AND routes a NAMED pack in runShow/runUse
  through loadActivePack({perCall}). PROOF (run locally @4ee530f): `gbrain schema
  list` prints all 7 bundled packs (not 2); `gbrain schema show gbrain-base-v2`
  prints 15 page_types (not "Unknown pack"); `gbrain schema show gbrain-recommended`
  prints the merged 30 page_types; `gbrain schema use gbrain-base-v2` /
  `use <custom-pack>` validate the full resolve and activate (were "Unknown pack").
still_needed_probe: patches/gbrain-schema-pack-bundled-ssot.probe.sh
target_files:
  - "gbrain src/core/schema-pack/bundled.ts (NEW SSOT file — BUNDLED_PACK_NAMES + BUNDLED_PACK_NAME_SET)"
  - "gbrain src/commands/schema.ts (FULL-FILE REPLACEMENT keyed to 4ee530f content sha256 6db3cdb0...; runList -> SSOT; runShow/runUse named path -> loadActivePack({perCall}))"
why: >
  Upstream #1574/#1726 (open, confirmed @ 4ee530f): the bundled-pack registry
  disagrees across files — load-active defaultPackLocator knows 7 (resolution-
  correct), mutate BUNDLED_PACK_NAMES has 3, commands/schema packPathByName knows
  ONLY gbrain-base, and runList hardcodes a 2-entry display list. So `gbrain schema
  use/show <gbrain-base-v2|lenspack>` prints "Unknown pack" (packPathByName falls
  through to ~/.gbrain/schema-packs/<name>/, absent for a bundled pack) and `schema
  list` shows only 2 — the operator can't even select the base-v2 their custom pack
  extends. The fix is a NEW FILE (bundled.ts — the established cat>-a-new-file
  precedent — as the SSOT for the 7 bundled names) plus a FULL-FILE REPLACEMENT of
  commands/schema.ts (guarded by a pre-clobber content-checksum gate, sha256 must
  equal the pinned 4ee530f hash 6db3cdb0...; mismatch FAILS THE BUILD): runList
  consumes the SSOT (shows all 7), and the LOAD-BEARING edit — runShow <name> AND
  runUse <name> now route through loadActivePack({perCall}), the SAME resolver as the
  active path, so (a) named show/use resolve ALL bundled packs (defaultPackLocator
  already knows all 7) and (b) named show returns the MERGED manifest, so
  `schema show <name>` and `schema active` AGREE (the scope critique flagged that
  without this reroute, `show <name>` stays child-only and the claimed merged numbers
  are fiction); runUse validates the FULLY RESOLVED pack before writing config
  (refuses a pack whose merge/parse fails). SCOPE: load-active.ts and mutate.ts are
  DELIBERATELY untouched — defaultPackLocator's 7-list was already correct, and
  leaving its literals inline keeps the upstream lens-pack source-assertion test green
  (lens-pack-manifests.test.ts greps load-active.ts text); mutate's read-only guard is
  left as-is (widening it to all 7 would change lens-pack mutability behavior — out of
  scope). DEPENDS on FIX-SP-MERGE being applied FIRST (the reroute only yields merged
  counts once the merge is live) — the Dockerfile orders merge -> yaml -> ssot. NOT
  filed upstream (operator decision — VF-only fork patch). Proven locally end-to-end +
  363 schema-pack tests pass on the baked tree.
reapply: docker-build
deprecate_when: >
  garrytan/gbrain consolidates the bundled-pack lists into one source and teaches
  packPathByName/schema-use to resolve all bundled packs (so `schema show
  gbrain-base-v2` works upstream) and GBRAIN_REF advances past it. On ANY GBRAIN_REF
  bump the pre-clobber checksum gate fails the build first (commands/schema.ts
  changed) — re-read the upstream file, re-key the drop-in (UPGRADING_GBRAIN.md ->
  "Re-keying a full-file-replacement patch"), or retire if upstream fixed it. The
  still_needed_probe checks whether the gbrain-base-only packPathByName special-case
  + the 2-entry runList literal are gone.
