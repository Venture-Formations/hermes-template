id: gbrain-source-pages-mentions-only
title: "Exclude type:source pages from typed-verb link inference (mentions-only) (FIX-TE-2)"
category: gbrain-core
risk: red
repo: hermes-template
source: patches/gbrain-source-pages-mentions-only.sh
source_sha: "c08310a5f296316eedb39a59e2305939beba4b2b67ee8915482a12386abfa81a"
anchor: "if (pageType === 'media') {"
invariant: "src/core/link-extraction.ts inferLinkType returns 'mentions' for pageType 'source' before any verb regex runs"
still_needed_probe: patches/gbrain-source-pages-mentions-only.probe.sh
target_files:
  - "gbrain src/core/link-extraction.ts:684 (inferLinkType media-guard; inserts a sibling source-guard)"
why: >
  inferLinkType applies tuned per-edge verb regexes (FOUNDED_RE / INVESTED_RE /
  ADVISES_RE / WORKS_AT_RE) and person-page role priors to every non-media
  page. type:source captures (web/article/feed bodies, transcripts) and
  podcast episodes are RAW text ABOUT third parties — a transcript that quotes
  "Sequoia invested in Acme" would mint a spurious invested_in edge FROM the
  source page. The code already does this exclusion for type:media at the top
  of the function (link-extraction.ts:684); podcasts are type:media so they are
  already covered, but type:source web/article/feed captures are NOT. This
  patch inserts a sibling early-return guard so source pages emit `mentions`
  edges only. Narrow and low-risk — does NOT touch the BrainBench-calibrated
  verb heuristics (that is the separate, upstream-bound FIX-TE-1).
reapply: docker-build
deprecate_when: "garrytan/gbrain gates verb inference by endpoint type upstream (e.g. FIX-TE-1 lands), making source pages mentions-only natively"
added: "2026-06-05"
