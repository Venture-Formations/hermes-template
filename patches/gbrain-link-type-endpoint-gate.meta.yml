# Read by hermes-workspace/tools/gen-modifications.ts -> MODIFICATIONS.md.
#
# source_sha below is a PLACEHOLDER. The generator does NOT auto-fill it — it
# only VALIDATES (fails --check on mismatch). To fill after moving the .sh into
# hermes-template/patches/:
#   1. compute the sha256 of the .sh BODY (raw bytes):
#        shasum -a 256 hermes-template/patches/gbrain-link-type-endpoint-gate.sh
#      (== Bun.CryptoHasher("sha256") over the file bytes; gen-modifications.ts:36)
#   2. paste the 64-hex digest into source_sha below (replace PLACEHOLDER_…).
#   3. regenerate the registry from the hermes-template checkout:
#        bun run tools/gen-modifications.ts          # writes MODIFICATIONS.md + lock
#        bun run tools/gen-modifications.ts --check  # must print "registry in sync"
# The pre-commit gate runs --check and blocks the commit until the sha matches.
# If you ever edit the .sh, the sha changes → re-run steps 1–3.

id: gbrain-link-type-endpoint-gate
title: "Endpoint/directionality gate on inferLinkType — suppress impossible verb assignments (FIX-TE-1)"
category: gbrain-core
risk: red
repo: hermes-template
source: patches/gbrain-link-type-endpoint-gate.sh
source_sha: "da086c708a5c4f09732ceb6393b7d2e7865484efdbdd1f166265fbf95ea9a296"

# anchor: the unique structural comment inside inferLinkType that introduces the
# per-edge verb block. Checked present by the patch body itself (fails the
# Docker build if gone); also checked by gen-modifications.ts --check in CI.
anchor: "// Per-edge verb rules."

# anchor_verified_at_pin: the anchor was manually confirmed to be present and
# unique inside `export function inferLinkType(...)` at the exact commit below.
anchor_verified_at_pin: true

# anchor_file_line: location of the anchor in the pinned gbrain tree.
anchor_file_line: "src/core/link-extraction.ts:693 (gbrain@099d9a8)"

# invariant: what verify-upgrade.sh (or a manual gbrain call) can assert on the
# running container to confirm this patch is working correctly.
#
# Testable form (add to verify-upgrade.sh):
#   # Build a tiny Node/Bun inline test that imports the patched inferLinkType
#   # and asserts person→person returns 'mentions' for all employment verbs:
#   bun -e "
#     import { inferLinkType } from '/usr/local/bun/install/global/node_modules/gbrain/src/core/link-extraction.ts';
#     const cases = [
#       ['person','works at Acme',  undefined, 'people/bob'],
#       ['person','invested in XYZ',undefined, 'people/alice'],
#       ['person','founded Startup',undefined, 'people/carol'],
#       ['company','was founded by', undefined, 'companies/other-co'],
#     ];
#     for (const [pt, ctx, gc, ts] of cases) {
#       const result = inferLinkType(pt, ctx, gc, ts);
#       if (result !== 'mentions') { console.error('FAIL', pt, '->', ts, '=', result); process.exit(1); }
#     }
#     console.log('OK: endpoint gate verified');
#   "
invariant: >
  inferLinkType(pageType='person', context='works at Acme', globalContext=undefined,
  targetSlug='people/bob') returns 'mentions' (not 'works_at');
  inferLinkType(pageType='company', context='was founded by X', globalContext=undefined,
  targetSlug='companies/other') returns 'mentions' (not 'founded');
  inferLinkType(pageType='person', context='works at Stripe', globalContext=undefined,
  targetSlug='companies/stripe') returns 'works_at' (intact positive case).

still_needed_probe: patches/gbrain-link-type-endpoint-gate.probe.sh

target_files:
  - "gbrain src/core/link-extraction.ts:693 (inferLinkType per-edge verb block; inserts two endpoint guards before the verb regexes)"

why: >
  inferLinkType (src/core/link-extraction.ts:683) runs the BrainBench-calibrated
  per-edge verb regexes (FOUNDED_RE / INVESTED_RE / ADVISES_RE / WORKS_AT_RE)
  before checking whether the TARGET endpoint type is semantically compatible.
  This mints structurally impossible edges: person→person works_at, person→person
  invested_in, person→person founded, and company→company founded — all of which
  appear in the Venture-Formations brain at volume (gavin-baker alone has 24 false
  edges). The FS-source path (inferTypeByDir, extract.ts:345-356) is already
  endpoint-aware and returns 'mentions' for these combinations; the DB-source path
  diverged. This patch inserts two conservative endpoint guards immediately BEFORE
  the verb regexes:  (A) if targetSlug starts with 'people/', return 'mentions'
  before any verb fires; (B) if pageType is not 'person', return 'mentions' before
  FOUNDED_RE runs (founded is only valid person→company). These guards ONLY tighten
  false-positive paths — every true-positive (person→company works_at/invested_in/
  founded/advises) is left fully intact. The BrainBench regex bodies are untouched.

reapply: docker-build    # idempotent perl splice; re-runs after the gbrain install on every GBRAIN_REF bump

deprecate_when: >
  garrytan/gbrain lands FIX-TE-1 upstream: `inferLinkType` gains a `fromType` /
  `toType` parameter (or equivalent endpoint-aware logic) and the DB path
  converges with inferTypeByDir natively. At that point, remove this patch and
  the FIX-TE-2 patch (gbrain-source-pages-mentions-only.sh) together if gbrain
  also gates source pages upstream.

added: "2026-06-08"
last_validated_ref: "gbrain@1eb430a"
upstream: garrytan/gbrain

# ── REQUIRED OPERATOR DOCUMENTATION ─────────────────────────────────────────

undo: |
  To remove this patch and return to stock gbrain behaviour:
  1. In hermes-template/patches/ delete:
       gbrain-link-type-endpoint-gate.sh
       gbrain-link-type-endpoint-gate.meta.yml
  2. In the hermes-template Dockerfile (branch deploy/venture-formations-fork),
     remove the RUN line that executes this patch, e.g.:
       RUN /workspace/patches/gbrain-link-type-endpoint-gate.sh
  3. Regenerate the modification registry:
       bun run tools/gen-modifications.ts
       bun run tools/gen-modifications.ts --check   # must pass
  4. Commit and push → Railway rebuild → the new image will NOT contain
     the endpoint guards and inferLinkType returns to stock (the old container
     keeps serving with zero outage until the rebuild completes).
  Effect: person→person and company→company false edges will resume accumulating
  in the DB on the next `gbrain extract links` run. Run a compensating
  `gbrain graph prune` or manual SQL cleanup to remove the stale edges if desired.

redo: |
  Docker build re-applies automatically: the Dockerfile RUN line executes the .sh
  immediately after `bun install -g github:garrytan/gbrain#${GBRAIN_REF}` on every
  GBRAIN_REF bump. The script is idempotent (grep for 'FIX-TE-1' sentinel → no-op
  if already applied). No manual step needed on routine gbrain upgrades.
  To re-apply manually on a running container:
    railway ssh -p <project> -s <service> -e <env> "bash /data/workspace/docs/brain-audit-2026-06-05/proposed-patches/gbrain-link-type-endpoint-gate.sh"
  NOTE: in-place application is reverted on the next Railway rebuild (the baked
  image is the durable form); use the manual path only for incident diagnosis.

upgrade_eval: |
  After each GBRAIN_REF bump, perform these checks before declaring the upgrade
  healthy:

  1. ANCHOR CHECK — verify the anchor is still present and unique:
       grep -nF "// Per-edge verb rules." \
         /usr/local/bun/install/global/node_modules/gbrain/src/core/link-extraction.ts
     Expected: exactly ONE hit, inside `export function inferLinkType(...)`.
     If the line is gone or moved, the patch itself will fail the Docker build
     (exit 1 at the anchor-check block) — the old container keeps serving.
     Action: open the new inferLinkType, find where the per-edge verb block lives,
     update the ANCHOR_ESC variable in the .sh and update anchor_file_line here.

  2. UPSTREAM FIX CHECK — has gbrain fixed this natively?
     grep -n "startsWith('people/')\|toType\|fromType\|endpoint.*gate\|direction.*gate" \
       /usr/local/bun/install/global/node_modules/gbrain/src/core/link-extraction.ts
     If gbrain now accepts fromType/toType parameters in inferLinkType, or adds its
     own endpoint guard, this patch is superseded → deprecate per deprecate_when
     above (delete .sh + .meta.yml, drop the Dockerfile RUN line, regen registry).

  3. NEW FALSE-POSITIVE CLASSES — re-run the BrainBench eval (if available):
     The calibration targets are 94.4% (templated) / 85% (rich-prose).  If the
     eval suite is accessible, run it and confirm no regression below those targets.
     If BrainBench is not available, do a spot-check on 5-10 person entity pages
     in the live brain that previously had false person→person edges:
       gbrain get gavin-baker --links
     Expect: zero works_at / invested_in / founded edges toward people/ targets.

  4. NEW VERB ADDITIONS — if gbrain adds a new typed verb (e.g. 'mentors',
     'reports_to', 'co-founded_with') check whether it should also be gated by
     the endpoint guards.  The current guards are conservative (only the *→person
     and non-person→founded classes) so new verbs are NOT automatically gated.
     Evaluate each new verb's valid endpoint combinations and update Guard A/B
     accordingly.

  5. INVARIANT RE-CONFIRM — run the inline Bun assertion from the `invariant`
     field above (or the equivalent verify-upgrade.sh check) and confirm
     all three cases pass (two false-positive → 'mentions' and one true-positive
     → 'works_at').

rollback_speed: |
  FAIL-SAFE: if the anchor is absent at Docker build time, the patch script exits
  non-zero and the Docker build FAILS. Railway keeps the PREVIOUS (old) container
  image running — zero service interruption. No rollback needed; fix the anchor
  re-point and rebuild.
  If a bad behavioral regression is discovered AFTER a successful build:
  - Revert the hermes-template Dockerfile commit (remove the RUN line) and push.
  - Railway auto-rebuilds from the reverted commit in ~3-5 minutes.
  - During that window the running container continues serving the patched version
    (it is not stopped until the new image is promoted).
  - Any false-positive edges already purged from the DB by the patched version
    will need a compensating `gbrain extract links --force` to re-emit them
    (not expected to be needed — removing impossible edges is the goal).
  Total rollback time: ~3-5 min for Railway rebuild + promotion.

# UPSTREAM CANDIDATE: YES.
# The correct long-term fix is a garrytan/gbrain PR that adds fromType/toType
# (or equivalent) to inferLinkType so the DB path matches inferTypeByDir's
# already-correct endpoint contract, and validates against BrainBench before
# merge.  See SPECS-upstream.md §FIX-TE-1 for the full upstream spec.
# Until that lands, this patch is the local bridge.
