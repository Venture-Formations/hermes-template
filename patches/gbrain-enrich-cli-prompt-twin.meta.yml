  The CLI `gbrain enrich --thin` compile step (thin.ts buildEnrichPrompt) is the
  code twin of the live agent enrich skill. Its system prompt only forbids
  inventing numbers (never instructs preserving them with speaker) and
  KIND_SECTION_GUIDANCE says "concise dossier"/"concise company profile",
  pressuring compression — the same flattening class FIX-EN-1/EN-2 fix in the
  agent skill. This path is DEFAULT-OFF here (cycle.enrich_thin disabled by
  default per src/core/cycle/enrich-thin.ts; cycle.enrich_thin.enabled OFF in
  /data/.gbrain/config.json — confirmed live in #25), so the
  patch is PROTECTIVE-ONLY: it pre-installs the verbatim-claim + contradiction
  HARD RULE so that IF enrich_thin is ever enabled it does not reintroduce the
  regression. Ranks BELOW FIX-EN-1/EN-2.
