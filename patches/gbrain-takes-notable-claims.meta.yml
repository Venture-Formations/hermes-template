invariant: >
  After build, src/core/takes/fence-write.ts (writeTakesToFence) and
  src/core/takes/route.ts (resolveTakeSubjects + resolveSpeaker) exist and carry
  the FIX-TK-2 sentinel; ALLOWED_PAGE_TYPES in extract-takes-from-pages.ts
  includes 'source','person','company'; and extractTakesFromPages writes each
  classified claim to the `## Takes` fence of every resolved SUBJECT entity page
  (markdown-first, via writeTakesToFence) attributed to the page's speaker,
  retaining the DB-only addTakesBatch path ONLY as the fallback sink for
  stubGuardBlocked / legacyFallback / fenceWriteFailed and routing no-subject
  claims to their origin page (no regression). FIX-TK-2-A (2026-06-18): the
  stub-create guard now requires a SUBJECT_DIR prefix (people/companies/concepts/
  topics/deals) — a `sources/<...>` slug is stubGuardBlocked and routed DB-only
  (page_id=origin row), preventing a lowercased source-slug twin from minting a
  colliding type:concept page that clobbers the real type:source page. The FIX-TK-2-WIRING sentinel is
  present in extract-takes-from-pages.ts.

still_needed_probe: patches/gbrain-takes-notable-claims.probe.sh

target_files:
  - "gbrain src/core/takes/fence-write.ts (NEW — Part A; writeTakesToFence, mirrors facts/fence-write.ts)"
  - "gbrain src/core/takes/route.ts (NEW — Part C helpers; resolveTakeSubjects + resolveSpeaker)"
  - "gbrain src/core/extract-takes-from-pages.ts:20-22 (Part B — ALLOWED_PAGE_TYPES widen)"
  - "gbrain src/core/extract-takes-from-pages.ts:18,71,136,201-213 (Part C — imports, PageRow.frontmatter, SELECT, per-subject fence-write loop + per-run gazetteer/local_path decls)"

why: >
  The fidelity audit (docs/brain-audit-2026-06-05/03-fidelity-audit.md) measured
  ~19% essence retention on entity pages: the brain keeps commodity facts and
  loses the analyst TAKES (quantified/contrarian/predictive claims). The v0.42
  takes pipeline is ALREADY RUNNING on the live container
  (takes.bootstrap_enabled=true) but its value is thrown on the floor — three
  confirmed code gaps. (1) No writeTakesToFence: extract-takes-from-pages.ts
  flushes via engine.addTakesBatch (DB-only INSERT); the `## Takes` fence
  renderer/parser exist (takes-fence.ts) but nothing on the write path calls
  them, so a take never lands in the page BODY and compiled_truth IS the body
  (markdown.ts) — invisible to get_page / a reader. Facts solved this in v0.32.2
  with writeFactsToFence. (2) ALLOWED_PAGE_TYPES skips source/person/company —
  the page types that carry the alpha (source transcripts; entity pages). (3) No
  subject routing / holder attribution: every take is keyed to the page it was
  READ from and authored by 'system', not routed to the entity it is ABOUT nor
  attributed to the speaker (facts/backstop.ts:425 "Phase 5: fence-write per
  entity" already does this). The takes table is PAGE-SCOPED
  (UNIQUE (page_id, row_num)) — the page IS the subject, holder is the speaker —
  so there is NO schema migration; this is purely code, mirroring the facts model.

reapply: docker-build

deprecate_when: >
  The FIX-TK-2 design is merged upstream into garrytan/gbrain (a PR adding a
  markdown-first take write path + subject/speaker routing to the takes
  extractor) AND GBRAIN_REF is bumped past that commit. At that point the
  upstream extractor writes takes to entity-page fences natively; remove this
  patch and confirm `gbrain takes extract --from-pages` over a source page
  produces a `## Takes` fence on the resolved entity page without it.

