  The Docker build RUN block re-applies the .sh automatically after each
  `bun install -g github:garrytan/gbrain` call in the Dockerfile. Idempotent:
  the FIX-TK-2 sentinel (in the two new files) and the FIX-TK-2-WIRING sentinel
