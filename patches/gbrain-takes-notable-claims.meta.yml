upgrade_eval: >
  1. Re-grep every PREFLIGHT anchor (see Secondary anchors above) at the new
     GBRAIN_REF. If any is absent the Docker build already failed (re-point the
     .sh). NOTE the takes files are FLAT under src/core/ at the pin — if upstream
     introduces a real src/core/takes/ dir, reconcile the new-file placement and
     the './takes/...' import paths in the Part-C wiring.
  2. Re-confirm the v0.42.26.0 → 099d9a8 drift the draft already corrected stays
     correct: TakeBatchInput date columns are since_date/until_date (engine.ts);
     pages slugs are per-source (scope the page_id lookup by source_id); `Link`
     is NOT re-exported by engine.ts (import from types.ts).
  3. Check if gbrain added a markdown-first take write path / subject routing
     upstream (a writeTakesToFence equivalent, or ALLOWED_PAGE_TYPES already
     covering source/person/company with per-entity routing). If so the
     deprecate_when condition is met — remove the patch and confirm entity pages
     gain `## Takes` fences in the new install without it.
  4. Invariant re-confirm (verify-upgrade.sh): the two new files exist with the
     FIX-TK-2 sentinel, ALLOWED_PAGE_TYPES includes source/person/company, and
     the FIX-TK-2-WIRING sentinel is present in extract-takes-from-pages.ts.
  5. Bump last_validated_ref to the new gbrain@<commit>.

rollback_speed: >
  Fail-safe: any broken PREFLIGHT anchor exits the .sh non-zero → Docker build
  fails → old container keeps serving, no outage. The only live-container risk
  is a silently-misapplied patch, which verify-upgrade.sh step 4 catches. RISK
  is HIGH because Parts B/C change extractor behavior (what is mined + where it
  lands) — but the change is markdown-first (git-canonical, reversible by editing
  fences) and preserves the DB-only fallback + the no-subject→origin-page path.
