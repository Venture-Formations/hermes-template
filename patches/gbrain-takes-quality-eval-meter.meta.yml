why: >
  Two meter defects verified in runner.ts. (P2) DEFAULT_MODEL_PANEL defaults to
  [openai:gpt-4o, anthropic:claude-opus-4-7, google:gemini-1.5-pro]; on this
  deployment only the anthropic id reroutes to grok ($0) via FIX-NA-1, so a bare
  `gbrain eval takes-quality run` gets <2 successful models -> verdict
  INCONCLUSIVE, and a default run would bill the native OPENAI_API_KEY + Google
  key (FIX-CME-1-class native-billing leak). (P1) the eval sample query has NO
  `active` filter in either branch, so it scores struck (active=false)/superseded
  rows that every other reader (searchTakes, vector recall, rollups) excludes — a
  latent correctness bug and the substrate that makes the SAFE reversible
  supersede/soft-strike cleanup path actually drop a take from the eval sample.
  Repoint the default panel to 3 distinct anthropic ids and add the active filter
  to both branches. Pure read-path/config; zero brain mutation. Validated live
  2026-06-16: bare run goes INCONCLUSIVE -> FAIL 6.3 with 3/3 anthropic models.
