# ---------------------------------------------------------------------------
# gbrain-bump-dryrun.yml  (WS4-CI)
#
# GATES a gbrain bump BEFORE prod. The "gbrain daily update watcher" remote
# /schedule routine must run THIS workflow against a candidate garrytan/gbrain
# ref and only bump `ARG GBRAIN_REF` in the Dockerfile (+ merge) when the run
# is GREEN; on RED it opens an issue instead. See docs/WS4-watcher-rewire.md.
#
# What GREEN proves, end to end, against the CANDIDATE ref (a VANILLA, un-patched
# gbrain tree installed exactly as the Dockerfile installs it — same
# `BUN_INSTALL=/usr/local/bun` global install path the patches + probes resolve):
#
#   1. The ref resolves and installs (`bun install -g github:garrytan/gbrain#<ref>`
#      + `gbrain --version`).
#   2. PER-PATCH PROBE MATRIX — every patches/<id>.probe.sh is run against the
#      vanilla tree (via GBRAIN_SRC_OVERRIDE) and classified
#      STILL-NEEDED(0) / OBSOLETE(1) / UNKNOWN(2). OBSOLETE is recommend-only
#      (does NOT fail the run) — it flags a patch gbrain may have fixed upstream,
#      so the operator can retire it. UNKNOWN fails the run (a probe that can't
#      answer on the candidate is a regression to fix before bumping).
#   3. ALL patches/gbrain-*.sh apply cleanly to the candidate tree (each is
#      fail-closed: a moved anchor exits non-zero → RED), then anthropic-scan.sh
#      proves the no-native-Anthropic guarantee still holds, then `gbrain
#      --version` confirms the PATCHED tree still loads.
#
# RED (any patch failed to apply / scan failed / version broke / a probe returned
# UNKNOWN) => the job FAILS and the summary names the failing patch or leftover.
# The candidate ref must NOT be promoted to prod.
#
# This mirrors the Dockerfile build order (install vanilla → patch → scan →
# version) so a GREEN here means the prod Docker build will also go green.
# ---------------------------------------------------------------------------
name: gbrain bump dry-run (pre-prod gate)

on:
  workflow_dispatch:
    inputs:
      gbrain_ref:
        description: "garrytan/gbrain ref (commit sha / branch) to dry-run. Default = the ref currently pinned in the Dockerfile."
        required: false
        default: "1eb430a2df9f842a754dd6af9910f049ccac65a1"
  schedule:
    # Daily safety net so a candidate ref is exercised even when the remote
    # watcher routine is paused. Same gate; uses the dispatch default ref.
    - cron: "23 7 * * *"

# Least-privilege: the gate only reads the repo. It does NOT bump the Dockerfile
# or merge — that is the watcher routine's job, and only on GREEN.
permissions:
  contents: read

concurrency:
  group: gbrain-bump-dryrun-${{ github.event.inputs.gbrain_ref || 'scheduled' }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: dry-run candidate gbrain ref
    runs-on: ubuntu-latest
    env:
      # Install gbrain to the SAME global prefix the Dockerfile uses, so the
      # patches' and probes' src-tree resolution finds it at the canonical
      # /usr/local/bun/install/global/node_modules/gbrain/src path.
      BUN_INSTALL: /usr/local/bun
      # workflow_dispatch carries inputs; the scheduled run does not, so fall
      # back to the same default ref the dispatch input declares.
      GBRAIN_REF: ${{ github.event.inputs.gbrain_ref || '1eb430a2df9f842a754dd6af9910f049ccac65a1' }}
    steps:
      # 1. checkout hermes-template (this repo: patches/ + Dockerfile).
      - name: Checkout hermes-template
        uses: actions/checkout@v4

      - name: Resolve candidate ref
        id: ref
        run: |
          echo "[dryrun] candidate gbrain ref: ${GBRAIN_REF}"
          echo "gbrain_ref=${GBRAIN_REF}" >> "$GITHUB_OUTPUT"

      # 2. install bun, then install gbrain at the candidate ref into a VANILLA
      #    (un-patched) tree. BUN_INSTALL pins the global prefix so the src tree
      #    lands where the patches/probes look for it.
      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install candidate gbrain (vanilla tree) + version smoke check
        id: install
        run: |
          set -euo pipefail
          echo "BUN_INSTALL=${BUN_INSTALL}" >> "$GITHUB_ENV"
          echo "${BUN_INSTALL}/bin" >> "$GITHUB_PATH"
          export PATH="${BUN_INSTALL}/bin:${PATH}"

          echo "[dryrun] installing github:garrytan/gbrain#${GBRAIN_REF} (vanilla)…"
          bun install -g "github:garrytan/gbrain#${GBRAIN_REF}"

          GBRAIN_SRC="${BUN_INSTALL}/install/global/node_modules/gbrain/src"
          if [ ! -d "${GBRAIN_SRC}" ]; then
            echo "::error::gbrain src tree not found at ${GBRAIN_SRC} after install" >&2
            exit 1
          fi
          echo "GBRAIN_SRC=${GBRAIN_SRC}" >> "$GITHUB_ENV"

          # Step-1 smoke check: the candidate ref must load and print a version.
          VER="$(gbrain --version 2>&1)" || {
            echo "::error::gbrain --version failed on vanilla candidate ${GBRAIN_REF}" >&2
            echo "${VER}" >&2
            exit 1
          }
          echo "[dryrun] vanilla gbrain --version: ${VER}"
          echo "vanilla_version=${VER}" >> "$GITHUB_OUTPUT"

      # 3. PER-PATCH PROBE MATRIX against the VANILLA tree (before any patch is
      #    applied). 0=STILL-NEEDED, 1=OBSOLETE (recommend-only), 2=UNKNOWN (RED).
      - name: Per-patch probe matrix (obsolescence check)
        id: probes
        run: |
          set -uo pipefail
          export PATH="${BUN_INSTALL}/bin:${PATH}"
          export GBRAIN_SRC_OVERRIDE="${GBRAIN_SRC}"

          : > /tmp/probe_obsolete.txt
          : > /tmp/probe_unknown.txt
          : > /tmp/probe_table.md
          {
            echo "| patch | probe result | exit |"
            echo "|---|---|---|"
          } >> /tmp/probe_table.md

          any_unknown=0
          shopt -s nullglob
          probes=( patches/*.probe.sh )
          if [ ${#probes[@]} -eq 0 ]; then
            echo "::warning::no patches/*.probe.sh found — nothing to probe"
          fi

          for probe in "${probes[@]}"; do
            id="$(basename "${probe}" .probe.sh)"
            echo "::group::probe ${id}"
            bash "${probe}"; code=$?
            echo "::endgroup::"
            case "${code}" in
              0) label="STILL-NEEDED" ;;
              1) label="OBSOLETE (recommend retire)"; echo "${id}" >> /tmp/probe_obsolete.txt ;;
              2) label="UNKNOWN"; echo "${id}" >> /tmp/probe_unknown.txt; any_unknown=1 ;;
              *) label="UNEXPECTED(${code})"; echo "${id}" >> /tmp/probe_unknown.txt; any_unknown=1 ;;
            esac
            echo "| \`${id}\` | ${label} | ${code} |" >> /tmp/probe_table.md
            echo "[dryrun] probe ${id} -> ${label} (exit ${code})"
          done

          echo "any_unknown=${any_unknown}" >> "$GITHUB_OUTPUT"
          # Surface UNKNOWN as a hard gate: a probe that can't answer on the
          # candidate is a regression to resolve BEFORE bumping. (Recorded here;
          # the final summary step turns it RED so the table still prints.)

      # 4. Apply ALL patches/gbrain-*.sh (skip *.probe.sh + anthropic-scan.sh),
      #    then run anthropic-scan.sh, then a final `gbrain --version`. Each
      #    patch is fail-closed: a moved anchor exits non-zero → this step RED.
      - name: Apply all gbrain-*.sh patches + scan + version
        id: apply
        run: |
          set -uo pipefail
          export PATH="${BUN_INSTALL}/bin:${PATH}"

          : > /tmp/applied.txt
          : > /tmp/apply_fail.txt
          fail=0

          shopt -s nullglob
          for patch in patches/gbrain-*.sh; do
            case "${patch}" in
              *.probe.sh) continue ;;       # probes ran in step 3
            esac
            id="$(basename "${patch}" .sh)"
            echo "::group::apply ${id}"
            if bash "${patch}"; then
              echo "${id}" >> /tmp/applied.txt
              echo "[dryrun] applied ${id} OK"
            else
              code=$?
              echo "::error::patch ${id} FAILED to apply (exit ${code}) — anchor likely moved on candidate ${GBRAIN_REF}" >&2
              echo "${id} (apply exit ${code})" >> /tmp/apply_fail.txt
              fail=1
            fi
            echo "::endgroup::"
          done

          # anthropic-scan.sh proves the no-native-Anthropic guarantee post-patch.
          echo "::group::anthropic-scan"
          if bash patches/anthropic-scan.sh; then
            echo "[dryrun] anthropic-scan OK"
            echo "scan OK" > /tmp/scan_status.txt
          else
            code=$?
            echo "::error::anthropic-scan.sh FAILED (exit ${code}) — no-native-Anthropic guarantee not proven" >&2
            echo "anthropic-scan (exit ${code})" >> /tmp/apply_fail.txt
            echo "scan FAIL" > /tmp/scan_status.txt
            fail=1
          fi
          echo "::endgroup::"

          # Final version smoke: the PATCHED tree must still load.
          if VER="$(gbrain --version 2>&1)"; then
            echo "[dryrun] patched gbrain --version: ${VER}"
            echo "patched_version=${VER}" >> "$GITHUB_OUTPUT"
            echo "${VER}" > /tmp/patched_version.txt
          else
            code=$?
            echo "::error::gbrain --version FAILED on the PATCHED candidate tree (exit ${code})" >&2
            echo "gbrain --version on patched tree (exit ${code})" >> /tmp/apply_fail.txt
            echo "(failed to load)" > /tmp/patched_version.txt
            fail=1
          fi

          echo "apply_fail=${fail}" >> "$GITHUB_OUTPUT"

      # 5a. Build the human summary (GREEN/RED) — always runs so the result is
      #     legible even on failure. Sets the run's final pass/fail.
      - name: Summarize result (set GREEN/RED)
        id: summary
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -uo pipefail
          ref="${GBRAIN_REF}"
          probe_table="$(cat /tmp/probe_table.md 2>/dev/null || echo '(no probes ran)')"
          obsolete="$(cat /tmp/probe_obsolete.txt 2>/dev/null || true)"
          unknown="$(cat /tmp/probe_unknown.txt 2>/dev/null || true)"
          applied="$(cat /tmp/applied.txt 2>/dev/null || true)"
          apply_fail="$(cat /tmp/apply_fail.txt 2>/dev/null || true)"
          scan_status="$(cat /tmp/scan_status.txt 2>/dev/null || echo 'scan DID NOT RUN')"
          patched_version="$(cat /tmp/patched_version.txt 2>/dev/null || echo '(unknown)')"

          red=0
          [ -n "${apply_fail}" ] && red=1
          [ -n "${unknown}" ] && red=1
          [ "${{ steps.apply.outcome }}" != "success" ] && red=1

          if [ "${red}" -eq 0 ]; then
            verdict="GREEN ✅ — candidate ref \`${ref}\` is safe to bump to prod."
          else
            verdict="RED ❌ — candidate ref \`${ref}\` must NOT be promoted."
          fi

          {
            echo "## gbrain bump dry-run — ${verdict}"
            echo ""
            echo "**Candidate ref:** \`${ref}\`"
            echo "**Patched \`gbrain --version\`:** \`${patched_version}\`"
            echo "**anthropic-scan:** ${scan_status}"
            echo ""
            echo "### Per-patch probe matrix (vanilla tree)"
            echo "${probe_table}"
            echo ""
            if [ -n "${obsolete}" ]; then
              echo "### ⚠️ OBSOLETE patches (recommend-only — review for retirement)"
              echo "These probes report gbrain may have addressed the issue upstream on this ref."
              echo "They do NOT block the bump. Consider retiring per each patch's deprecate_when:"
              echo ""
              echo "${obsolete}" | sed 's/^/- /'
              echo ""
            fi
            if [ "${red}" -ne 0 ]; then
              echo "### ❌ RED — blocking reasons"
              if [ -n "${apply_fail}" ]; then
                echo "**Failing patch(es) / leftover:**"
                echo "${apply_fail}" | sed 's/^/- /'
                echo ""
              fi
              if [ -n "${unknown}" ]; then
                echo "**Probe(s) returned UNKNOWN (could not determine — resolve before bumping):**"
                echo "${unknown}" | sed 's/^/- /'
                echo ""
              fi
              if [ "${{ steps.apply.outcome }}" != "success" ]; then
                echo "The apply/scan/version step did not complete successfully."
                echo ""
              fi
            else
              echo "### ✅ GREEN"
              echo "All patches applied, anthropic-scan OK, patched tree loads."
              echo ""
              echo "**Applied patches:**"
              echo "${applied}" | sed 's/^/- /'
            fi
          } | tee "$GITHUB_STEP_SUMMARY"

          echo "verdict_red=${red}" >> "$GITHUB_OUTPUT"
          echo "verdict_line=${verdict}" >> "$GITHUB_OUTPUT"

      # 5b. Optional Slack post — ONLY if a SLACK_WEBHOOK_URL secret exists.
      #     Non-fatal (continue-on-error) so a Slack hiccup never reds a GREEN gate.
      - name: Post result to Slack (optional, non-fatal)
        if: ${{ always() && steps.install.outcome == 'success' && env.SLACK_WEBHOOK_URL != '' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERDICT_LINE: ${{ steps.summary.outputs.verdict_line }}
        run: |
          set -uo pipefail
          verdict="${VERDICT_LINE}"
          ref="${GBRAIN_REF}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          obsolete="$(cat /tmp/probe_obsolete.txt 2>/dev/null | paste -sd ',' - || true)"
          extra=""
          [ -n "${obsolete}" ] && extra=" | OBSOLETE (recommend retire): ${obsolete}"
          text="gbrain bump dry-run: ${verdict}${extra} | ${run_url}"
          payload="$(printf '{"text": %s}' "$(printf '%s' "${text}" | bun --eval 'process.stdout.write(JSON.stringify(require("fs").readFileSync(0,"utf8")))' 2>/dev/null || printf '"%s"' "${text}")")"
          curl -fsS -X POST -H 'Content-type: application/json' --data "${payload}" "${SLACK_WEBHOOK_URL}" \
            && echo "[dryrun] posted result to Slack" \
            || echo "[dryrun] Slack post failed (non-fatal)"

      # 5c. Enforce the verdict: fail the job RED so the watcher routine treats a
      #     red gate as red. (Kept separate from the summary so the summary always
      #     prints first.)
      - name: Enforce verdict (fail job on RED)
        if: ${{ always() }}
        run: |
          set -uo pipefail
          if [ "${{ steps.install.outcome }}" != "success" ]; then
            echo "::error::install/version of the candidate ref failed — RED." >&2
            exit 1
          fi
          if [ "${{ steps.summary.outputs.verdict_red }}" != "0" ]; then
            echo "::error::dry-run verdict is RED — candidate ref must not be promoted." >&2
            exit 1
          fi
          echo "[dryrun] verdict GREEN — gate passed."
